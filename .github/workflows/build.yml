# Тесты на каждый push/PR; по тегу v* — сборка Setup.exe и публикация релиза.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Тесты
        run: dotnet test tests/Dota2RPC.Tests/Dota2RPC.Tests.csproj -c Release --nologo

      - name: Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Сборка Setup.exe
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./build.ps1 -SkipTests -Version $version

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist/Setup.exe -Algorithm SHA256).Hash
          $tag = '${{ github.ref_name }}'
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/Setup.exe --clobber
          } else {
            gh release create $tag dist/Setup.exe --title "Dota 2 Discord Rich Presence $tag" --notes "Собрано GitHub Actions. SHA256 Setup.exe: ``$hash``"
          }
